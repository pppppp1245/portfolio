<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김수연 Portfolio Intro</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/intro.css">
</head>
<body>
  <main class="desk-scene" aria-label="포트폴리오 인트로 책상 씬">
    <div class="wall"></div>
    <div class="floor-object trash-bin desk-item" aria-hidden="true">
      <span></span>
    </div>
    <section class="desk-surface" aria-label="책상">
      <div class="lamp desk-item" aria-hidden="true">
        <img class="desk-image lamp-image" src="./assets/img/lamp.png" alt="">
        <div class="lamp-light"></div>
      </div>

      <div class="mug desk-item" aria-hidden="true">
        <div class="steam steam-one"></div>
        <div class="steam steam-two"></div>
        <div class="steam steam-three"></div>
        <div class="steam steam-four"></div>
        <div class="steam steam-five"></div>
        <img class="desk-image mug-image" src="./assets/img/cup.png" width="243.58" height="237.79" alt="">
      </div>

      <div class="keyboard desk-item" aria-hidden="true">
        <img class="desk-image keyboard-image" src="./assets/img/keyboard.png" width="719.62" height="164.73" alt="">
      </div>

      <button class="monitor desk-item" id="monitor" type="button" aria-label="메인 포트폴리오 화면으로 이동">
        <img class="desk-image monitor-image" src="./assets/img/computer.png" width="704.6" height="576.98" alt="">
        <span class="screen-text image-screen-text">PORTFOLIO</span>
      </button>

      <div class="mouse desk-item" aria-hidden="true">
        <span></span>
      </div>

      <div class="plant desk-item" aria-hidden="true">
        <div class="plant-leaves">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="plant-pot"></div>
      </div>

      <div class="pen-holder desk-item" aria-hidden="true">
        <div class="holder-body"></div>
        <div class="pen pen-1"></div>
        <div class="pen pen-2"></div>
        <div class="pen pen-3"></div>
      </div>

      <div class="notebook desk-item" aria-hidden="true">
        <div class="notebook-cover"></div>
        <div class="notebook-pages"></div>
        <div class="notebook-spiral"></div>
      </div>
    </section>
  </main>

  <script src="./js/intro.js"></script>
</body>
</html>
