<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김수연 Portfolio Intro</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/intro.css">
</head>
<body>
  <main class="desk-scene" aria-label="포트폴리오 인트로 책상 씬">
    <div class="wall"></div>
    <div class="floor-object trash-bin desk-item" aria-hidden="true">
      <span></span>
    </div>
    <section class="desk-surface" aria-label="책상">
      <div class="lamp desk-item" aria-hidden="true">
        <div class="lamp-base"></div>
        <div class="lamp-arm"></div>
        <div class="lamp-head"></div>
        <div class="lamp-light"></div>
      </div>

      <button class="monitor desk-item" id="monitor" type="button" aria-label="메인 포트폴리오 화면으로 이동">
        <span class="monitor-screen">
          <span class="screen-reflection"></span>
          <span class="screen-text">PORTFOLIO</span>
        </span>
        <span class="monitor-stand"></span>
        <span class="monitor-base"></span>
      </button>

      <div class="keyboard desk-item" aria-hidden="true">
        <div class="key-row">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="key-row">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="key-row">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="key-row">
          <span></span><span class="space-key"></span><span></span><span></span>
        </div>
      </div>

      <div class="mouse desk-item" aria-hidden="true">
        <span></span>
      </div>

      <div class="plant desk-item" aria-hidden="true">
        <div class="plant-leaves">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="plant-pot"></div>
      </div>

      <div class="mug desk-item" aria-hidden="true">
        <div class="steam steam-one"></div>
        <div class="steam steam-two"></div>
        <div class="steam steam-three"></div>
        <div class="mug-body"></div>
        <div class="mug-handle"></div>
      </div>
    </section>
  </main>

  <script src="./js/intro.js"></script>
</body>
</html>
